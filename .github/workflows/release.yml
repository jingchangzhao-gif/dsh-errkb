name: Release

# A tag is the only release trigger. The job checks the tag, changelog and
# binary, packages the portable executable plus the toolbox ZIP, and publishes
# the GitHub release. The npm job publishes the DSH connector package when an
# NPM_TOKEN secret exists; without it the job reports the skip and succeeds.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the packaging tools
        run: go install github.com/tc-hib/go-winres@v0.3.3

      - name: Check the release inputs
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          ./packaging/windows/release.ps1 -Mode check -Version $tag.TrimStart("v") -Tag $tag

      - name: Build and package the release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          ./packaging/windows/release.ps1 -Mode package -Version $tag.TrimStart("v") -Tag $tag

      - name: Describe the bundle
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $bundle = "dist\release\errkb-$version"
          Get-ChildItem $bundle | Format-Table Name, Length
          Get-Content (Join-Path $bundle "SHA256SUMS")

      - name: Publish the GitHub release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $bundle = "dist\release\errkb-$version"
          $files = Get-ChildItem $bundle -File | ForEach-Object { $_.FullName }
          $notes = Join-Path $bundle "RELEASE-NOTES.md"
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            gh release upload $tag $files --clobber
          }
          else {
            gh release create $tag $files --title "errkb $version" --notes-file $notes
          }

      - name: Keep the bundle for the build record
        uses: actions/upload-artifact@v4
        with:
          name: errkb-${{ github.ref_name }}-release
          path: dist/release/**
          if-no-files-found: error

  npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check that package.json matches the tag
        run: |
          node -e "
            const pkg = require('./package.json');
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (pkg.version !== tag) {
              console.error('package.json version ' + pkg.version + ' does not match tag ' + tag);
              process.exit(1);
            }
          "

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report the missing npm token
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: echo "NPM_TOKEN is not configured; the package was not published. Add the secret and rerun this job for the same tag."
